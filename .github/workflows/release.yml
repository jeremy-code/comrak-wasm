name: Release

on:
    push:
        branches: ["main"]

permissions: {} # Each job defines its own permissions explicitly

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        permissions:
            id-token: write # This is required for requesting the JWT
            contents: write # Required to create release
            pull-requests: write # Required to create PR
        steps:
            - name: Check out Git repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # Fetch all history for all branches and tags so that changesets can
                  # compare against the correct base branch
                  fetch-depth: 0

            - name: Set up pnpm package manager
              uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
              with:
                  cache: true
                  install: true

            - name: Set up Rust toolchain
              uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

            - uses: cargo-bins/cargo-binstall@c06f6a0003f7c6165a00c89d1697731c9e8a5c72 # v1.25.2
              with:
                  version: 1.21.1

            - name: Install cargo-edit
              run: |
                  cargo binstall --no-confirm cargo-edit@0.13.13

            - name: Build
              run: pnpm run build

            - name: Create pull request for version bump and publish to npm
              uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
              with:
                  publish-script: pnpm run ci:publish
                  # Has to be in its own script, otherwise, error "Too many
                  # arguments passed to changesets - we only accept the command
                  # name as an argument"
                  #
                  # https://github.com/frontity/frontity/issues/386
                  version-script: pnpm run ci:version
                  commit-message: "chore(release): version packages"
                  pr-title: "chore(release): version packages"
                  create-github-releases: true
                  push-git-tags: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
